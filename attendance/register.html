<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Register</title>
	<link rel="stylesheet" type="text/css" href="css/index.css">
</head>
<body>

<div class="main">
  <div class="logo">
  	<img src="assets/logo.JPG" alt="logo" width="100%">
  </div>
  <div class="card">
  	<h2>welcome KIBU attendance</h2>
  	<form enctype="multipart/form-data">
  		<div class="form-group">
  			<label>Enter First name</label>
  			<input type="" name="" placeholder="First name" id="txtfname"> 
  		</div>
  		<div class="form-group">
  			<label>Enter Last name</label>
  			<input type="" name="" placeholder="Last name" id="txtlname">
  		</div>
  		<div class="form-group">
  			<label>Enter Email</label>
  			<input type="" name="" placeholder="example@gmail.com" id="txtemail">
  		</div>
  		<div class="form-group">
  			<label>Enter password</label>
  			<input type="password" name="" placeholder="******" id="txtpass"> 
  		</div>
  		<div class="form-group">
  			<label>Confirm password</label>
  			<input type="password" name="" placeholder="******" id="txtcompass"> 
  		</div>
  	    <button class="btn-primary" id="btncreate">Create account</button>
        <button class="btn-register"><a href="index.html">Already have an account? login now</a></button>
  	</form>
  </div>
	
</div>



<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>
<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
